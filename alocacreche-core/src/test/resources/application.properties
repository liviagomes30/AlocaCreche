alocacreche.outbox.publicador.habilitado=false
# Os ITs nao dependem de Redis: porta fechada e timeout curto, o cache da fila e fail-open.
# O IT com Redis real (InscricaoFilaRedisIT) sobrescreve host e porta pelo Testcontainers.
spring.data.redis.port=1
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms
