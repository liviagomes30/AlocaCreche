spring:
  application:
    name: alocacreche-relatorios

  datasource:
    # Banco proprio, separado do alocacreche-core (ADR 0001, decisao 2) — porta
    # 5433 no docker-compose.yml da raiz do repositorio.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/alocacreche_relatorios}
    # NUNCA o usuario bootstrap do container (sempre superuser, ignora RLS
    # incondicionalmente) - conecta como a role dedicada nao-superuser criada em
    # docker/postgres-relatorios-init/01-app-role.sql. Ver .specs/STATE.md AD-002.
    username: ${SPRING_DATASOURCE_USERNAME:alocacreche_app}
    password: ${SPRING_DATASOURCE_PASSWORD:alocacreche_app}

  sql:
    init:
      # Sem isso, schema.sql so roda para banco embutido - Postgres real e ignorado
      # silenciosamente por padrao, mesmo com defer-datasource-initialization.
      mode: always

  jpa:
    open-in-view: false
    # Roda schema.sql (RLS) depois do ddl-auto criar as tabelas - ver ADR 0002 / AD-002.
    defer-datasource-initialization: true
    hibernate:
      # TODO: trocar para "validate" assim que Flyway/Liquibase gerenciar o
      # schema das projecoes de leitura.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  cache:
    redis:
      # So existe 1 cache (painel-publico) por enquanto - propriedade global em vez de
      # RedisCacheManagerBuilderCustomizer por-cache (ver design.md, relatorios-painel-publico).
      time-to-live: 60000

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8082}

sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 28800
  is-read-header: true
  is-read-cookie: false
  is-read-body: false
  is-share: false
  is-log: false
  jwt-secret-key: ${SA_TOKEN_JWT_SECRET:troque-este-segredo-antes-de-qualquer-deploy}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.alocacreche: INFO
