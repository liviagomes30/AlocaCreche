spring:
  application:
    name: alocacreche-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: alocacreche-relatorios
              uri: ${ALOCACRECHE_RELATORIOS_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/relatorios/**
            - id: alocacreche-core
              uri: ${ALOCACRECHE_CORE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/**

alocacreche:
  gateway:
    painel-publico:
      # Requisicoes por minuto e por IP na unica rota publica (acima disso: 429 com Retry-After).
      limite-por-minuto: ${ALOCACRECHE_PAINEL_LIMITE_POR_MINUTO:120}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
